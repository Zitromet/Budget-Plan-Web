<!DOCTYPE html>
<!-- Budget Website - sign-in page. After signing in you go to dashboard.html -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d9488" />
  <title>Budget Plan — Sign in</title>
  <link rel="icon" type="image/png" href="budget_icon.png" />
  <link rel="apple-touch-icon" href="budget_icon.png" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/website.css" />
</head>
<body class="login-page">
  <main class="login-box section-card">
    <img src="budget_icon.png" alt="" class="login-logo" />
    <h1>Friday Budget Planner</h1>
    <p class="login-sub">Sign in to see and edit your budget.</p>
    <div id="configWarning" class="notice notice-warn" hidden>
      <strong>Not connected yet.</strong> Put the Supabase URL and anon key in
      <code>config.js</code> (see SETUP.md).
    </div>
    <form id="loginForm">
      <label for="email">E-mail</label>
      <input type="email" id="email" autocomplete="username" required />
      <button type="submit" class="btn btn-primary btn-block">✉️ E-mail me a sign-in link</button>
    </form>
    <p id="loginMsg" class="login-msg" role="status"></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="js/supa.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
